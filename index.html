<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16141a">
<title>Middle-earth · An Interactive Atlas of the Third Age</title>
<meta name="description" content="An unofficial, fan-made 3D atlas of Middle-earth with places and the journeys of the Fellowship.">
<link rel="preload" href="fonts/cinzel-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/garamond-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23d9b45a' stroke-width='6'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="3D map of Middle-earth"></canvas>
  <div id="labels" aria-hidden="false"></div>

  <header id="title">
    <h1>Middle-earth</h1>
    <p>An Interactive Atlas of the Third Age</p>
  </header>

  <nav id="tools">
    <button id="btn-journeys" class="tool" aria-expanded="false" aria-controls="legend" title="Journeys">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18c3-6 6 2 9-4s4-6 7-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4" cy="18" r="2" fill="currentColor"/><circle cx="20" cy="6" r="2" fill="currentColor"/></svg>
      <span>Journeys</span>
    </button>
    <button id="btn-reset" class="tool" title="Reset view">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Reset</span>
    </button>
    <button id="btn-compass" class="tool round" title="Face north">
      <svg viewBox="0 0 24 24" aria-hidden="true" id="compass-needle"><path d="M12 3l3.5 9H8.5z" fill="#c8483a"/><path d="M12 21l-3.5-9h7z" fill="currentColor" opacity=".7"/></svg>
    </button>
  </nav>

  <aside id="legend" class="panel" hidden>
    <div class="panel-head">
      <h2>Journeys</h2>
      <button class="x" id="legend-close" aria-label="Close journeys">×</button>
    </div>
    <p class="hint-sm">Tap a name for its story, or a line on the map.</p>
    <ul id="legend-list"></ul>
    <div class="legend-actions">
      <button id="show-all" class="link">Show all</button>
      <button id="hide-all" class="link">Hide all</button>
    </div>
  </aside>

  <section id="card" class="card" hidden role="dialog" aria-modal="false" aria-labelledby="card-title">
    <div class="card-grip"></div>
    <button class="x" id="card-close" aria-label="Close">×</button>
    <div id="card-body"></div>
  </section>

  <div id="toast" aria-live="polite"></div>
  <div id="hint">Drag to move · Pinch or scroll to zoom · Two fingers (or right-drag) to rotate &amp; tilt</div>
  <footer id="disclaimer">Unofficial fan-made atlas. Middle-earth created by J.R.R. Tolkien.</footer>

  <div id="loading">
    <div class="ring"></div>
    <p>Unrolling the map…</p>
  </div>
  <noscript><p class="noscript">This atlas needs JavaScript and WebGL.</p></noscript>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
